name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'DocumentRagSystem.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore DocumentRagSystem.slnx

      # Gap 1: Code Formatting & Style Linting
      - name: Verify Code Formatting
        run: dotnet format DocumentRagSystem.slnx --verify-no-changes --verbosity normal

      # Gap 3: Dependency Security Audit
      - name: Audit NuGet Packages for Vulnerabilities
        run: |
          AUDIT_OUTPUT=$(dotnet list DocumentRagSystem.slnx package --vulnerable --include-transitive)
          echo "$AUDIT_OUTPUT"
          if echo "$AUDIT_OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected in the solution!"
            exit 1
          fi

      # Gap 2: Compiler Warning Enforcement
      - name: Build Solution (Release with Warnings as Errors)
        run: dotnet build DocumentRagSystem.slnx -c Release --no-restore --warnaserror

      - name: Run Unit Tests
        run: >
          dotnet test tests/UnitTests/DocumentRagSystem.UnitTests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/UnitTests

      - name: Run Integration Tests
        run: >
          dotnet test tests/IntegrationTests/DocumentRagSystem.IntegrationTests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "console;verbosity=detailed"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/IntegrationTests

      - name: Run E2E Tests
        run: >
          dotnet test tests/E2ETests/DocumentRagSystem.E2ETests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=e2e-tests.trx"
          --logger "console;verbosity=detailed"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/E2ETests

      # Gap 4: PR Visibility - Test Results Reporting
      - name: Publish Test Results Summary
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Test Results (.NET 10)
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Gap 4: Coverage Gating & PR Visibility
      - name: Generate Code Coverage Report & Summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'MarkdownSummaryGithub;Badges;TextSummary'
          assemblyfilters: '-*.Tests;-*.UnitTests;-*.IntegrationTests;-*.E2ETests'
          title: 'DocumentRagSystem Test Coverage'

      - name: Publish Coverage to GitHub Step Summary
        if: always()
        run: |
          if [ -f "coveragereport/SummaryGithub.md" ]; then
            cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce Coverage Threshold Gate
        run: |
          if [ -f "coveragereport/Summary.txt" ]; then
            COVERAGE_INT=$(grep -oP 'Line coverage:\s+\K[0-9]+' coveragereport/Summary.txt | head -n 1 || echo "0")
            echo "Total line coverage: ${COVERAGE_INT}%"
            THRESHOLD=50
            if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
              echo "::error::Code coverage (${COVERAGE_INT}%) is below the minimum required threshold of ${THRESHOLD}%!"
              exit 1
            fi
            echo "Code coverage threshold check passed (${COVERAGE_INT}% >= ${THRESHOLD}%)."
          else
            echo "::error::Coverage summary not found!"
            exit 1
          fi

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build WebApi Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/DocumentRagSystem.WebApi/Dockerfile
          load: true
          push: false
          tags: document-rag-system-api:ci

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/DocumentRagSystem.Worker/Dockerfile
          load: true
          push: false
          tags: document-rag-system-worker:ci

      # Gap 3: Container Security & Vulnerability Scanning
      - name: Scan WebApi Image for Vulnerabilities (Trivy)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 0
          document-rag-system-api:ci

      - name: Scan Worker Image for Vulnerabilities (Trivy)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 0
          document-rag-system-worker:ci
