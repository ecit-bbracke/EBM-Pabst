<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebm-papst Databeregning & Ventilator Formular</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0a3f60',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
        }
        .form-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #f8fafc;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800 bg-slate-50">

    <!-- Top Navigation Bar -->
    <header class="bg-brand-900 text-white shadow-md flex-shrink-0 z-20">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 p-2 rounded-lg text-white shadow-sm">
                    <i class="fa-solid fa-calculator text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Databeregning & Ventilator Formular</h1>
                    <p class="text-[11px] text-slate-300">EBMPabst Energiberegning Katalog</p>
                </div>
            </div>
            <nav class="flex items-center space-x-2.5">
                <a href="index.html" class="bg-brand-800/80 hover:bg-brand-700 text-slate-100 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2 border border-brand-700/40">
                    <i class="fa-solid fa-comments text-xs"></i>
                    <span>Chat Assistent</span>
                </a>
                <a href="documents.html" class="bg-brand-800/80 hover:bg-brand-700 text-slate-100 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2 border border-brand-700/40">
                    <i class="fa-solid fa-folder-gear text-xs"></i>
                    <span>Dokumenter</span>
                </a>
                <span class="bg-brand-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center space-x-2 border border-brand-500">
                    <i class="fa-solid fa-calculator text-xs"></i>
                    <span>Databeregning</span>
                </span>
                <a id="nav-users" href="users.html" class="hidden bg-brand-800/80 hover:bg-brand-700 text-slate-100 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2 border border-brand-700/40">
                    <i class="fa-solid fa-users text-xs"></i>
                    <span>Brugere</span>
                </a>
                <a href="/databeregningsform" target="_blank" rel="noopener noreferrer" class="bg-brand-800/80 hover:bg-brand-700 text-slate-200 px-2.5 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-1 border border-brand-700/40" title="Åbn i nyt vindue">
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
                <button onclick="handleLogout()" class="bg-brand-800/80 hover:bg-rose-900/60 text-slate-200 hover:text-rose-100 px-3.5 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-1.5 ml-1 border border-brand-700/40" title="Log ud">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                    <span>Log ud</span>
                </button>
            </nav>
                </div>
                </header>

                <!-- Embedded Sister Application Frame -->
                <main class="flex-1 w-full h-full relative overflow-hidden bg-slate-50">
                <iframe 
                id="databeregning-frame"
                src="/databeregningsform" 
                title="ebm-papst Databeregning formular"
                class="form-frame"
                allow="fullscreen">
                </iframe>
                </main>

                <script>
                document.addEventListener('DOMContentLoaded', checkAdminNav);

                async function checkAdminNav() {
                try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.isAdmin) {
                        const navUsers = document.getElementById('nav-users');
                        if (navUsers) navUsers.classList.remove('hidden');
                    }
                }
                } catch {}
                }

                async function handleLogout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch {}
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
