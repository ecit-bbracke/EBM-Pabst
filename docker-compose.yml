version: '3.8'

services:
  webapi:
    image: document-rag-system-api
    build:
      context: .
      dockerfile: src/DocumentRagSystem.WebApi/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Qdrant__ConnectionString=http://qdrant:6334
      - Qdrant__CollectionName=production-chunks
      - Gemini__ApiKey=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}
    depends_on:
      - qdrant

  worker:
    image: document-rag-system-worker
    build:
      context: .
      dockerfile: src/DocumentRagSystem.Worker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Qdrant__ConnectionString=http://qdrant:6334
      - Qdrant__CollectionName=production-chunks
      - Gemini__ApiKey=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
