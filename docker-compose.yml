services:
  webapi:
    image: document-rag-system-api
    build:
      context: .
      dockerfile: src/DocumentRagSystem.WebApi/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__IdentityDb=Data Source=/app/data/identity.db
      - Authentication__ApiKey=${API_KEY:-}
      - Workqueue__User=${WORKQUEUE_USER:-}
      - Workqueue__Password=${WORKQUEUE_PASSWORD:-}
      - SisterProject__BaseUrl=${SISTER_PROJECT_BASE_URL:-http://host.docker.internal:5224}
      - Qdrant__ConnectionString=http://qdrant:6334
      - Qdrant__CollectionName=production-chunks
      - Gemini__ApiKey=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
      - database_data:/app/data
    depends_on:
      - qdrant

  worker:
    image: document-rag-system-worker
    build:
      context: .
      dockerfile: src/DocumentRagSystem.Worker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__IdentityDb=Data Source=/app/data/identity.db
      - Qdrant__ConnectionString=http://qdrant:6334
      - Qdrant__CollectionName=production-chunks
      - Gemini__ApiKey=${GEMINI_API_KEY}
    volumes:
      - uploads_data:/app/uploads
      - database_data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  uploads_data:
  database_data:
